<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌传播监测洞察平台</title>
<link rel="stylesheet" href="style.css?v=20260415105000">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="rgba(255,255,255,0.2)"/><path d="M10 20 Q20 8 30 20 Q20 32 10 20Z" fill="white" opacity="0.9"/><circle cx="20" cy="20" r="5" fill="white"/></svg>
    </div>
    <div class="logo-text">
      <span class="logo-title">传播洞察</span>
      <span class="logo-sub">Brand Insight Platform</span>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-group">
      <div class="nav-group-label">监测模块</div>
      <div class="nav-item active" onclick="showPage('monitor-list')" data-page="monitor-list">
        <svg viewBox="0 0 20 20"><path d="M3 3h14v14H3z" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M3 7h14M7 3v14" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>监测项目列表</span>
        <span class="nav-badge">24</span>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-group-label">智能报告</div>
      <div class="nav-item" onclick="showPage('report-list')" data-page="report-list">
        <svg viewBox="0 0 20 20"><path d="M5 3h10l2 2v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M7 8h6M7 11h6M7 14h4" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>报告管理</span>
      </div>
      <div class="nav-item" onclick="showPage('report-template')" data-page="report-template">
        <svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="1" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M3 7h14M7 7v10" stroke="currentColor" stroke-width="1.5"/></svg>
        <span>报告模板中心</span>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-group-label">系统管理</div>
      <div class="nav-item" onclick="showPage('account-mgmt')" data-page="account-mgmt">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="7" r="3" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M3 17c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>账号管理</span>
      </div>
      <div class="nav-item" onclick="showPage('refresh-log')" data-page="refresh-log">
        <svg viewBox="0 0 20 20"><path d="M4 10 A6 6 0 1 1 10 16" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/><path d="M4 10 L2 7M4 10 L7 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>刷新记录日志</span>
      </div>
      <div class="nav-item" onclick="showPage('refresh-mgmt')" data-page="refresh-mgmt">
        <svg viewBox="0 0 20 20"><path d="M4 10 A6 6 0 1 1 10 16" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round"/><path d="M4 10 L2 7M4 10 L7 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>互动量刷新管理</span>
      </div>
      <div class="nav-item" onclick="showPage('category-config')" data-page="category-config">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M4.2 15.8l1.4-1.4M14.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>分类设置</span>
      </div>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">张</div>
      <div class="user-detail">
        <span class="user-name">张三丰</span>
        <span class="user-role">超级管理员</span>
      </div>
    </div>
    <div class="credit-info">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--primary)" opacity="0.15"/><circle cx="8" cy="8" r="4" fill="var(--primary)"/></svg>
      <span>洞察豆</span>
      <span class="credit-num">12,580</span>
    </div>
  </div>
</aside>

<!-- 主体 -->
<div class="main-wrapper">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="sidebar-toggle" onclick="toggleSidebar()">
        <svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="breadcrumb" id="breadcrumb">监测模块 / 监测项目列表</div>
    </div>
    <div class="topbar-right">
      <div class="topbar-search">
        <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M13 13l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input type="text" placeholder="全局搜索...">
      </div>
      <div class="topbar-btn" title="消息通知">
        <svg viewBox="0 0 20 20"><path d="M10 2a6 6 0 016 6v4l1.5 2.5H2.5L4 12V8a6 6 0 016-6z" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M8.5 16a1.5 1.5 0 003 0" stroke="currentColor" stroke-width="1.5"/></svg>
        <span class="badge-dot"></span>
      </div>
      <div class="topbar-btn" title="帮助">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" stroke="currentColor" fill="none" stroke-width="1.5"/><path d="M10 11v-1a2 2 0 10-2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="14" r="0.8" fill="currentColor"/></svg>
      </div>
    </div>
  </header>

  <!-- 页面内容容器 -->
  <main class="content" id="content">
    <!-- 页面由JS动态渲染 -->
  </main>
</div>

<!-- 弹窗遮罩 -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>

<!-- 弹窗容器 -->
<div class="modal" id="modal">
  <div class="modal-header">
    <h3 id="modalTitle">弹窗标题</h3>
    <button class="modal-close" onclick="closeModal()">
      <svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-footer" id="modalFooter"></div>
</div>

<script src="app.js?v=20250421"></script>
<script src="page-monitor-config.js?v=20260414135000"></script>
    <script src="page-account-monitor.js?v=20260414134500"></script>
<script src="page-result-list.js?v=20260415105000"></script>
<script src="page-refresh.js?v=20260414120000"></script>
<script src="page-other.js?v=20250413"></script>
<script src="page-report.js?v=20260414170800"></script>
<script src="page-report-create.js?v=20260415093000"></script>
<script src="page-report-wizard.js?v=20260414222000"></script>
<script src="page-report-preview.js?v=20250413"></script>
<script src="page-report-edit.js?v=20260415174500"></script>
<script src="page-report-template.js?v=20260416163300"></script>
<script src="page-account.js?v=20260415100200"></script>
<script src="page-ai-monitor.js?v=20260415093000"></script>
</body>
</html>
